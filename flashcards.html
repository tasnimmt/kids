<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Kids Learn & Play</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button id="back" class="nav-btn">🏠 Home</button>
  <h1 id="set-title">Flashcards</h1>
  <div class="topbar-spacer" style="width:90px"></div>
</header>

<main class="flash-main">
  <div id="cat-picker" class="cat-picker"></div>
  <div id="card-area" class="card-area" hidden>
    <button id="prev" class="arrow-btn" aria-label="Previous">◀</button>
    <div id="card" class="flashcard">
      <div id="card-media" class="card-media"></div>
      <div id="card-names" class="card-names"></div>
    </div>
    <button id="next" class="arrow-btn" aria-label="Next">▶</button>
  </div>
  <p id="progress" class="progress"></p>
</main>

<script src="js/lang-state.js"></script>
<script src="js/data/words.js"></script>
<script src="js/data/countries.js"></script>
<script src="js/data/dinosaurs.js"></script>
<script src="js/flashcards.js"></script>
</body>
</html>
